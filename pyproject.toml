[project]
name = "cyclegan-mapas-satelite"
version = "0.1.0"
description = "CycleGAN para tradução não pareada entre mapas históricos e imagens de satélite (Aprendizado Não-Supervisionado, PUCRS)"
authors = [
    { name = "João Henrique da Luz", email = "joaohluz13@gmail.com" },
    { name = "Vittor Brits" },
    { name = "Marcelo" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9",
    "pillow>=11",
    "torch>=2.13",
]

[dependency-groups]
dev = ["pytest>=8"]

# Windows (PC de treino, RTX 2060 = sm_75): wheels CUDA 12.6. Linux (esta máquina, sem GPU): CPU, só para o smoke test.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
